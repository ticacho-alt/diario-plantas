<html lang="pt">

<title>Diário de Plantas</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{min-height:100vh;min-height:100dvh;background:#EDE6D6;font-family:'Inter',sans-serif;overscroll-behavior-y:contain}
:root{--green:#2F4A34;--green2:#5c6b52;--green3:#93a97f;--cream:#F8F4E7;--border:#d8d4bd;--text:#1f2e1a;--muted:#6b7a5f;--mono:'IBM Plex Mono',monospace;--serif:'Fraunces',serif;--orange:#e07b39;--blue-bg:#f0f4ee;--blue:#3a7a52}
.app{min-height:100vh;min-height:100dvh;padding:max(20px,env(safe-area-inset-top)) 16px calc(68px + env(safe-area-inset-bottom));background:#EDE6D6;background-image:radial-gradient(circle at 1px 1px,rgba(75,94,66,0.07) 1px,transparent 0);background-size:22px 22px}
.paper{max-width:560px;margin:0 auto}
/* Nav */
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--cream);border-top:1px solid var(--border);display:flex;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;cursor:pointer;color:#8a8568;font-family:var(--mono);font-size:9px;letter-spacing:.04em;text-transform:uppercase;padding:5px 0}
.nav-btn.active{color:var(--green)}
/* Typography */
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
h1{font-family:var(--serif);font-weight:700;font-size:32px;color:var(--text);margin:0 0 6px;letter-spacing:-.01em}
.sub{font-size:13.5px;color:var(--muted);font-family:var(--mono)}
/* Cards */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.plant-card{text-align:left;background:var(--cream);border:1px solid var(--border);border-radius:4px;padding:10px 10px 8px;cursor:pointer;display:flex;flex-direction:column;gap:8px;font-family:inherit;width:100%;position:relative}
.plant-card.dead{background:#fdf6ee;border:2px solid var(--orange)}
.plant-card.gifted{background:var(--blue-bg);border:2px solid #5c9e6e}
.card-photo{height:80px;border-radius:3px;background:repeating-linear-gradient(135deg,#eee9d8,#eee9d8 6px,#e6e1cd 6px,#e6e1cd 12px);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.card-photo img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:5px;right:5px;font-family:var(--mono);font-size:9px;text-transform:uppercase;color:#fff;padding:2px 6px;border-radius:3px}
.card-name{font-family:var(--serif);font-size:13px;font-weight:600;color:#223420;margin:0 0 4px;line-height:1.2}
.card-meta{display:flex;gap:6px;font-size:10px;color:var(--green2);margin-bottom:6px;flex-wrap:wrap;align-items:center}
.card-foot{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;color:#8a8568;border-top:1px dashed #d3cfb4;padding-top:6px}
/* Controls */
.search-row{display:flex;align-items:center;gap:8px;background:var(--cream);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--muted);margin-bottom:10px}
.search-row input{border:none;background:none;outline:none;font-size:16px;width:100%;font-family:inherit;color:var(--text)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.chip{font-family:var(--mono);font-size:11px;background:transparent;border:1px solid #c7c4a8;color:var(--green2);border-radius:20px;padding:7px 12px;cursor:pointer;min-height:34px}
.chip.active{background:var(--green);border-color:var(--green);color:#F4EFDE}
/* Detail */
.back-btn{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:#4b5e42;font-family:var(--mono);font-size:13px;cursor:pointer;padding:8px 0;margin:-8px 0 14px;min-height:40px}
.info-box{background:var(--cream);border:1px solid var(--border);border-radius:4px;padding:16px 18px;display:flex;flex-direction:column;gap:14px;margin-bottom:24px}
.info-row{display:flex;gap:10px;align-items:flex-start;color:#4b5e42}
.info-label{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:#8a8568;display:block;margin-bottom:2px}
.info-row p{margin:0;font-size:13.5px;color:#2c3826;line-height:1.4}
.tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:#4b5e42;background:#e4e2cf;border:1px solid #c7c4a8;border-radius:3px;padding:2px 7px;display:inline-block}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:8px;padding:12px 14px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;min-height:44px}
.btn-green{background:var(--green);color:#F4EFDE}
.btn-green2{background:var(--green2);color:#F4EFDE}
.btn-outline{background:var(--cream);border:1.5px solid #c7c4a8;color:var(--green2)}
.btn-orange{background:var(--orange);border:1.5px solid var(--orange);color:#fff}
.btn-outline-orange{background:none;border:1.5px solid var(--orange);color:#c0621e;border-radius:20px;padding:7px 14px}
.btn-outline-blue{background:none;border:1.5px solid #5c9e6e;color:#3a7a52;border-radius:20px;padding:7px 14px}
.btn-blue-active{background:#5c9e6e;border:1.5px solid #5c9e6e;color:#fff;border-radius:20px;padding:7px 14px}
/* Photo bar */
.photo-bar{display:flex;flex-direction:column;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:20;background:#EDE6D6;border-top:1px solid var(--border);padding:10px 12px 16px;box-shadow:0 -6px 16px -8px rgba(31,46,26,.25)}
/* Timeline */
.tl-entry{display:flex;gap:14px}
.tl-dot{width:9px;height:9px;border-radius:50%;background:#4b5e42;margin-top:6px;flex-shrink:0}
.tl-line{flex:1;width:1px;background:#d3cfb4;margin:4px 0}
/* Stock */
.stock-list{display:flex;flex-direction:column;background:var(--cream);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.stock-row{display:flex;align-items:center;justify-content:space-between;padding:14px;gap:12px;border-bottom:1px solid #ede9d5}
.stock-row:last-child{border-bottom:none}
.qty-wrap{display:flex;align-items:center;border-radius:8px;overflow:hidden}
.qty-btn{background:#eee9d8;border:none;cursor:pointer;padding:7px 11px;font-size:16px;font-weight:600;color:#4b5e42;min-height:38px;min-width:36px;line-height:1}
.qty-btn:disabled{color:#c7c4a8;cursor:default}
.qty-val{font-family:var(--mono);font-size:15px;font-weight:600;min-width:28px;text-align:center;padding:0 2px}
.order-btn{background:#eee9d8;border:1.5px solid #c7c4a8;border-radius:8px;cursor:pointer;padding:8px 10px;color:var(--muted);display:flex;align-items:center;min-height:38px}
.order-btn.on{background:var(--orange);border-color:var(--orange);color:#fff}
.order-banner{display:flex;align-items:center;gap:8px;background:#fff8ec;border:1.5px solid var(--orange);border-radius:8px;padding:11px 14px;font-size:13px;color:#c0621e;margin-bottom:20px;font-weight:500}
/* Estufa */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.kpi-card{border-radius:10px;padding:16px 14px;text-align:center}
.kpi-val{display:block;font-family:var(--serif);font-size:28px;font-weight:600;line-height:1}
.kpi-lbl{display:block;font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:#8a8568;margin-top:4px}
.kpi-ts{display:block;font-family:var(--mono);font-size:9px;color:#9a9578;margin-top:2px}
/* Stats */
.stat-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:28px}
.stat-kpi{border-radius:8px;padding:12px 6px;text-align:center}
.stat-kpi-val{display:block;font-family:var(--serif);font-size:20px;font-weight:600;line-height:1}
.stat-kpi-lbl{display:block;font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:#8a8568;margin-top:5px}
.stat-section{margin-bottom:26px}
.stat-title{font-family:var(--serif);font-size:17px;color:#223420;margin:0 0 12px}
.pill-list{background:var(--cream);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.pill-row{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid #ede9d5;font-size:13.5px;color:#2c3826;gap:12px}
.pill-row:last-child{border-bottom:none}
.pill-badge{font-family:var(--mono);font-size:11px;background:var(--green);color:#F4EFDE;border-radius:12px;padding:2px 8px;flex-shrink:0}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bar-track{flex:1;height:10px;background:#e4e2cf;border-radius:5px;overflow:hidden}
.bar-fill{height:100%;background:#4b5e42;border-radius:5px}
/* Settings */
.settings-section{background:var(--cream);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:16px}
/* Modal */
.modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);display:flex;flex-direction:column;overflow-y:auto}
.modal-body{background:#EDE6D6;border-radius:16px 16px 0 0;flex:1;max-width:520px;width:100%;margin:40px auto 0;padding:20px 16px 48px;overflow-y:auto}
/* Form */
.field label{display:block;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#8a8568;margin-bottom:3px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:6px;padding:9px 10px;font-size:15px;font-family:inherit;background:#fff;color:var(--text)}
.field input:focus,.field select:focus{outline:2px solid var(--green3);border-color:var(--green3)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 65px;gap:8px}
/* Chart SVG */
.chart-wrap{background:var(--cream);border:1px solid var(--border);border-radius:8px;padding:12px 4px 4px;overflow:hidden}
/* Scanning */
.scanning{text-align:center;padding:40px 20px;background:var(--cream);border:1px solid var(--border);border-radius:8px;margin-bottom:20px;font-family:var(--mono);font-size:13px;color:var(--muted)}
/* Range btns */
.range-btns{display:flex;gap:4px}
.range-btn{font-family:var(--mono);font-size:11px;padding:4px 10px;border-radius:12px;border:1px solid #c7c4a8;background:transparent;color:var(--green2);cursor:pointer}
.range-btn.active{background:var(--green);color:#F4EFDE;border-color:var(--green)}
/* Readings list */
.reading-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid #ede9d5}
.reading-row:last-child{border-bottom:none}
/* PictureThis modal */
.pt-modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.pt-box{background:var(--cream);border-radius:10px;padding:24px;max-width:420px;width:100%}
/* Error/success */
.err-box{background:#fff8ec;border:1px solid #e0a339;border-radius:6px;padding:10px 12px;font-size:11px;color:#8a5c00;font-family:var(--mono);line-height:1.5;word-break:break-word;margin-bottom:12px}
.ok-box{background:var(--blue-bg);border:1px solid var(--green3);border-radius:6px;padding:9px 12px;font-size:11px;color:var(--blue);font-family:var(--mono);margin-bottom:12px}
.hidden{display:none!important}
/* Add plant header btn */
.header-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
</style>
<script>
window.onerror = function(msg, src, line, col, err) {
  var d = document.getElementById('debug');
  if (!d) { d = document.createElement('div'); d.id = 'debug';
    d.style = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#c0392b;color:#fff;padding:12px;font-family:monospace;font-size:12px;white-space:pre-wrap;max-height:200px;overflow:auto';
    document.body.appendChild(d); }
  d.textContent += 'ERRO linha ' + line + ': ' + msg + '\n';
};
window.onunhandledrejection = function(e) {
  var d = document.getElementById('debug');
  if (!d) { d = document.createElement('div'); d.id = 'debug';
    d.style = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#c0392b;color:#fff;padding:12px;font-family:monospace;font-size:12px;white-space:pre-wrap;max-height:200px;overflow:auto';
    document.body.appendChild(d); }
  d.textContent += 'PROMISE: ' + (e.reason?.message || e.reason) + '\n';
};
document.addEventListener('DOMContentLoaded', function() {
  var d = document.createElement('div');
  d.style = 'position:fixed;top:0;left:0;right:0;z-index:9998;background:#2F4A34;color:#fff;padding:6px 12px;font-family:monospace;font-size:11px;text-align:center';
  d.textContent = 'A carregar...';
  d.id = 'loading';
  document.body.appendChild(d);
  setTimeout(function() {
    var l = document.getElementById('loading');
    var paper = document.getElementById('paper');
    if (l) {
      if (paper && paper.children.length > 0) { l.remove(); }
      else { l.style.background = '#c0621e'; l.textContent = 'JS carregou mas render() falhou — ver erro acima'; }
    }
  }, 3000);
});
</script>

// Compress image
function compressImage(file,maxDim=800,quality=0.65){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=e=>{const img=new Image();img.onload=()=>{let{width:w,height:hh}=img;if(w>hh&&w>maxDim){hh=Math.round(hh*maxDim/w);w=maxDim;}else if(hh>maxDim){w=Math.round(w*maxDim/hh);hh=maxDim;}const canvas=document.createElement("canvas");canvas.width=w;canvas.height=hh;canvas.getContext("2d").drawImage(img,0,0,w,hh);resolve(canvas.toDataURL("image/jpeg",quality));};img.onerror=reject;img.src=e.target.result;};reader.onerror=reject;reader.readAsDataURL(file);});}

// Gemini
function getGeminiKey(){return ls("gemini-api-key")||"";}
async function callGemini(base64,prompt,maxTokens=300){
  const key=getGeminiKey();if(!key)throw new Error("Sem API key. Configura nas Definições.");
  const body={contents:[{parts:[{inline_data:{mime_type:"image/jpeg",data:base64}},{text:prompt}]}],generationConfig:{maxOutputTokens:maxTokens,temperature:0.1}};
  const resp=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key="+key,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const data=await resp.json();
  if(data.error)throw new Error("Gemini: "+(data.error.message||JSON.stringify(data.error)));
  return(data.candidates?.[0]?.content?.parts?.[0]?.text)||"";
}
async function identifyPlant(base64){const text=await callGemini(base64,"Identifica a especie desta planta. Responde so com JSON valido sem markdown: {name,scientific,light,watering,soil,humidity,tempRange,picturethis,notes}",300);const m=text.match(/\{[\s\S]*\}/);if(!m)throw new Error("Sem JSON: "+text.slice(0,80));return JSON.parse(m[0]);}
async function extractReading(base64){const text=await callGemini(base64,"Le temperatura e humidade neste ecra. Responde so com JSON: {temp,hum}",80);const m=text.match(/\{[^}]+\}/);if(!m)throw new Error("Sem JSON: "+text.slice(0,80));const r=JSON.parse(m[0]);if(r.temp!=null&&(r.temp<-10||r.temp>60))r.temp=null;if(r.hum!=null&&(r.hum<0||r.hum>100))r.hum=null;return r;}

async function handleEstufaFile(file){
  if(!file)return;
  state.estufaError=null;state.estufaPhase="scanning";render();
  try{
    const dataUrl=await compressImage(file,600,0.6);
    state.estufaPreview=dataUrl;
    const base64=dataUrl.split(",")[1];
    const result=await extractReading(base64);
    state.estufaExtracted={temp:result.temp???"",hum:result.hum??""};
    state.estufaPhase="confirm";
  }catch(e){
    state.estufaError="Erro: "+e.message;state.estufaPhase="manual";
    state.estufaExtracted={temp:"",hum:""};
  }
  render();
}

function saveEstufaReading(){
  const t=parseFloat(String(state.estufaExtracted.temp).replace(",","."));
  const hum=parseFloat(String(state.estufaExtracted.hum).replace(",","."));
  if(isNaN(t)&&isNaN(hum)){state.estufaError="Introduz pelo menos temperatura ou humidade.";render();return;}
  const entry={id:Date.now().toString(36),ts:new Date().toISOString(),temp:isNaN(t)?null:t,hum:isNaN(hum)?null:hum,photo:state.estufaPreview};
  state.readings=[entry,...state.readings];
  lsSetJSON("estufa-v1",state.readings);
  state.estufaPhase="idle";state.estufaPreview=null;state.estufaError=null;
  document.querySelectorAll("#estufa-cam,#estufa-gal").forEach(el=>el.remove());
  render();
}

function renderChartSVG(data){
  const W=document.querySelector(".paper")?.clientWidth||340;
  const H=200,ml=36,mr=36,mt=10,mb=30;
  const cW=W-ml-mr,cH=H-mt-mb;
  const temps=data.map(d=>d.temp).filter(v=>v!=null);
  const hums=data.map(d=>d.hum).filter(v=>v!=null);
  const tMin=temps.length?Math.min(...temps)-2:0,tMax=temps.length?Math.max(...temps)+2:40;
  const hMin=0,hMax=100;
  const px=(i)=>ml+(i/(Math.max(data.length-1,1)))*cW;
  const pyT=(v)=>mt+cH-((v-tMin)/(tMax-tMin||1))*cH;
  const pyH=(v)=>mt+cH-((v-hMin)/(hMax-hMin||1))*cH;

  // Paths
  let tPath="",hPath="";let tStarted=false,hStarted=false;
  data.forEach((d,i)=>{
    if(d.temp!=null){tPath+=tStarted?` L${px(i).toFixed(1)},${pyT(d.temp).toFixed(1)}`:`M${px(i).toFixed(1)},${pyT(d.temp).toFixed(1)}`;tStarted=true;}else tStarted=false;
    if(d.hum!=null){hPath+=hStarted?` L${px(i).toFixed(1)},${pyH(d.hum).toFixed(1)}`:`M${px(i).toFixed(1)},${pyH(d.hum).toFixed(1)}`;hStarted=true;}else hStarted=false;
  });

  // Labels X (3 pontos)
  const xIdxs=[0,Math.floor(data.length/2),data.length-1].filter((v,i,a)=>a.indexOf(v)===i);

  const el=svg("svg",{width:W,height:H,style:"overflow:visible"},[
    // Grid
    ...[0,.25,.5,.75,1].map(t=>svg("line",{x1:ml,x2:ml+cW,y1:mt+cH*t,y2:mt+cH*t,stroke:"#e4e2cf","stroke-width":"0.5"})),
    // Temp line
    temps.length ? svg("path",{d:tPath,fill:"none",stroke:"#c0621e","stroke-width":"2","stroke-linecap":"round","stroke-linejoin":"round"}) : null,
    // Hum line
    hums.length ? svg("path",{d:hPath,fill:"none",stroke:"#2F4A34","stroke-width":"2","stroke-linecap":"round","stroke-linejoin":"round"}) : null,
    // Dots temp
    ...data.filter(d=>d.temp!=null).map((d,i)=>svg("circle",{cx:px(data.indexOf(d)),cy:pyT(d.temp),r:"3",fill:"#c0621e",stroke:"#fff","stroke-width":"1"})),
    // Dots hum
    ...data.filter(d=>d.hum!=null).map((d,i)=>svg("circle",{cx:px(data.indexOf(d)),cy:pyH(d.hum),r:"3",fill:"#2F4A34",stroke:"#fff","stroke-width":"1"})),
    // X labels
    ...xIdxs.map(i=>svg("text",{x:px(i),y:H-8,"text-anchor":"middle","font-size":"9","fill":"#6b7a5f","font-family":"monospace"},[data[i].label?.slice(-5)||""])),
    // Legend
    svg("text",{x:ml,y:mt-2,"font-size":"9","fill":"#c0621e","font-family":"monospace"},["Temp °C"]),
    svg("text",{x:ml+cW,y:mt-2,"text-anchor":"end","font-size":"9","fill":"#2F4A34","font-family":"monospace"},["Hum %"]),
  ]);
  return el;
}

      ["Substrato", Object.entries(bySoil).sort((a,b)=>b[1]-a[1])],
      ["Plantas por loja", Object.entries(byStore).sort((a,b)=>b[1]-a[1]), spendByStore],
      ["Aquisições por mês", Object.entries(byMonth).sort().map(([m,c])=>[new Date(m+"-01T00:00:00").toLocaleDateString("pt-PT",{month:"long",year:"numeric"}),c])],
      ["Humidade recomendada", Object.entries(byHum).sort()],
      ["Temperatura recomendada", Object.entries(byTemp).sort()],
    ].map(([title,entries,extra])=>
      h("div",{className:"stat-section"},[
        h("h2",{className:"stat-title"},[title]),
        h("div",{className:"pill-list"},entries.map(([l,c],i)=>
          h("div",{className:"pill-row",style:{borderBottom:i<entries.length-1?"1px solid #ede9d5":"none"}},[
            h("span",{style:{textTransform:"capitalize"}},[l]),
            h("div",{style:{display:"flex",gap:"8px",alignItems:"center"}},[
              extra ? h("span",{style:{fontFamily:"var(--mono)",fontSize:"11px",color:"#8a8568"}},["€"+(extra[l]||0).toFixed(2)]) : null,
              h("span",{className:"pill-badge"},[String(c)]),
            ]),
          ])
        )),
      ])
    ),
    h("div",{style:{height:"16px"}},[]),
  ]);
}

  return h("div",{},[
    h("header",{style:{marginBottom:"26px"}},[
      h("div",{className:"eyebrow"},["⚙️ Configuração"]),
      h("h1",{},["Definições"]),
      h("p",{className:"sub"},["API de IA"]),
    ]),
    h("div",{className:"settings-section"},[
      h("div",{style:{display:"flex",alignItems:"center",gap:"8px",marginBottom:"12px"}},[
        h("div",{style:{width:"10px",height:"10px",borderRadius:"50%",background:hasKey?"#5c9e6e":"#e07b39"}},[]),
        h("span",{style:{fontFamily:"var(--mono)",fontSize:"12px",color:hasKey?"#3a7a52":"#c0621e",fontWeight:600}},[hasKey?"Gemini API key configurada ✓":"API key não configurada"]),
      ]),
      h("p",{style:{fontSize:"13px",color:"var(--green2)",margin:"0 0 16px",lineHeight:1.6}},["A key do Gemini é necessária para identificar plantas e ler o medidor. É gratuita e guardada só no teu dispositivo."]),
      h("label",{style:{display:"block",fontFamily:"var(--mono)",fontSize:"10px",textTransform:"uppercase",letterSpacing:".05em",color:"#8a8568",marginBottom:"6px"}},["Gemini API Key"]),
      keyInput,
      h("button",{className:"btn btn-green",style:{width:"100%"},onClick:()=>{const k=keyInput.value.trim();lsSet("gemini-api-key",k);state.geminiSaved=true;render();}},["Guardar key"]),
      state.geminiSaved ? h("p",{style:{textAlign:"center",color:"#3a7a52",fontFamily:"var(--mono)",fontSize:"12px",marginTop:"8px"}},["✓ Guardada!"]) : null,
    ]),
    h("div",{className:"settings-section"},[
      h("div",{style:{fontFamily:"var(--serif)",fontSize:"15px",fontWeight:600,color:"var(--text)",marginBottom:"8px"}},["Como obter a key gratuita"]),
      h("ol",{style:{paddingLeft:"18px",display:"flex",flexDirection:"column",gap:"8px",fontSize:"13px",color:"var(--green2)",lineHeight:1.5}},[
        h("li",{},["Vai a aistudio.google.com"]),
        h("li",{},['Clica em "Get API key" → "Create API key"']),
        h("li",{},["Copia a key e cola acima"]),
      ]),
      h("p",{style:{fontSize:"12px",color:"#9a9578",margin:"12px 0 0",fontFamily:"var(--mono)",lineHeight:1.5}},["Gratuito · 15 pedidos/min · 1500/dia · sem cartão"]),
    ]),

}

// ─── Add Plant Modal ──────────────────────────────────────────────────────────
function resetAddForm(){return{name:"",scientific:"",store:"",date:new Date().toISOString().slice(0,10),price:"",light:"Luz Indireta Intensa",watering:"",soil:"SIRO Interior",humidity:"",tempRange:"",notes:"",picturethis:""};}

function renderAddModal(){
  const LIGHT_OPTS=["Luz Indireta Intensa","Luz Indireta Moderada","Luz Indireta Difusa","Luz Indireta Bright","Sol Direto / Luz Intensa","Sombra / Luz Indireta Suave","Luz Indireta a Média","Luz Indireta Forte"];
  const f=state.addForm||resetAddForm();

  const field=(label,key,type="text",opts=null)=>{
    if(opts){
      const sel=h("select",{onInput:e=>{state.addForm={...f,[key]:e.target.value};refreshModal();}},opts.map(o=>h("option",{value:o,selected:o===f[key]},[o])));
      return h("div",{className:"field"},[h("label",{},[label]),sel]);
    }
    const inp=h("input",{type,step:type==="number"?"0.01":undefined,value:f[key],onInput:e=>{state.addForm={...f,[key]:e.target.value};}});
    return h("div",{className:"field"},[h("label",{},[label]),inp]);
  };

  const modal=h("div",{className:"modal-overlay",id:"add-modal"},[
    h("div",{className:"modal-body"},[
      h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"18px"}},[
        h("h2",{style:{fontFamily:"var(--serif)",fontSize:"22px",fontWeight:700,color:"var(--text)"}},["Nova planta"]),
        h("button",{style:{background:"none",border:"none",cursor:"pointer",fontSize:"20px"},onClick:()=>{state.showAdd=false;document.getElementById("add-modal")?.remove();document.querySelectorAll("#add-cam,#add-gal").forEach(e=>e.remove());}},["✕"]),
      ]),

      state.addPhase==="idle" ? h("div",{style:{marginBottom:"20px"}},[
        h("p",{style:{fontSize:"13px",color:"var(--muted)",margin:"0 0 14px",lineHeight:1.6}},["Tira uma foto da planta e a IA identifica automaticamente."]),
        h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"8px"}},[
          (()=>{const id="add-cam";const inp=h("input",{type:"file",accept:"image/*",capture:"environment",id,style:{position:"absolute",opacity:"0",width:"1px",height:"1px",pointerEvents:"none"}});inp.addEventListener("change",e=>handleAddFile(e.target.files?.[0]));document.body.appendChild(inp);return h("label",{htmlFor:id,className:"btn btn-green",style:{cursor:"pointer",textAlign:"center",fontSize:"13px"}},["📷 Câmara"])})(),
          (()=>{const id="add-gal";const inp=h("input",{type:"file",accept:"image/*",id,style:{position:"absolute",opacity:"0",width:"1px",height:"1px",pointerEvents:"none"}});inp.addEventListener("change",e=>handleAddFile(e.target.files?.[0]));document.body.appendChild(inp);return h("label",{htmlFor:id,className:"btn btn-green2",style:{cursor:"pointer",textAlign:"center",fontSize:"13px"}},["+ Galeria"])})(),
          h("button",{className:"btn btn-outline",style:{fontSize:"13px"},onClick:()=>{state.addPhase="manual";state.addForm=resetAddForm();refreshModal();}},["Manual"]),
        ]),
      ]) : null,

      state.addPhase==="scanning" ? h("div",{className:"scanning"},["🔍 A identificar a planta..."]) : null,

      (state.addPhase==="confirm"||state.addPhase==="manual") ? h("div",{},[
        state.addPreview ? (()=>{const img=h("img",{alt:"",style:{width:"100%",maxHeight:"160px",objectFit:"contain",borderRadius:"8px",marginBottom:"12px",border:"1px solid var(--border)",display:"block"}});img.src=state.addPreview;return img;})() : null,
        state.addError ? h("div",{className:"err-box"},[state.addError]) : null,
        state.addPhase==="confirm"&&!state.addError ? h("div",{className:"ok-box"},["✓ Planta identificada — confirma ou corrige:"]) : null,
        h("div",{style:{display:"flex",flexDirection:"column",gap:"10px"}},[
          h("div",{className:"grid-2"},[field("Nome *","name"),field("Nome científico","scientific")]),
          h("div",{className:"grid-3"},[field("Loja","store"),field("Data","date","date"),field("€","price","number")]),
          field("Luz","light","text",LIGHT_OPTS),
          field("Rega","watering"),field("Substrato","soil"),
          h("div",{className:"grid-2"},[field("Humidade","humidity"),field("Temperatura","tempRange")]),
          field("Observações","notes"),
          h("div",{className:"field"},[h("label",{},["PictureThis URL"]),h("input",{type:"text",value:f.picturethis,style:{fontSize:"11px"},onInput:e=>{state.addForm={...f,picturethis:e.target.value};}})]),
        ]),
        h("div",{style:{display:"flex",gap:"8px",marginTop:"18px"}},[
          h("button",{className:"btn btn-green",style:{flex:1},onClick:saveNewPlant},["✓ Guardar planta"]),
          h("button",{className:"btn btn-outline",onClick:()=>{state.showAdd=false;document.getElementById("add-modal")?.remove();document.querySelectorAll("#add-cam,#add-gal").forEach(e=>e.remove());}},["✕"]),
        ]),
      ]) : null,
    ]),
  ]);
  return modal;
}

function refreshModal(){
  const existing=document.getElementById("add-modal");
  if(existing){existing.remove();}
  document.body.appendChild(renderAddModal());
}

async function handleAddFile(file){
  if(!file)return;
  state.addError=null;state.addPhase="scanning";refreshModal();
  try{
    const dataUrl=await compressImage(file,512,0.5);
    state.addPreview=dataUrl;
    const base64=dataUrl.split(",")[1];
    const result=await identifyPlant(base64);
    state.addForm={...(state.addForm||resetAddForm()),name:result.name||"",scientific:result.scientific||"",light:result.light||"Luz Indireta Intensa",watering:result.watering||"",soil:result.soil||"SIRO Interior",humidity:result.humidity||"",tempRange:result.tempRange||"",notes:result.notes||"",picturethis:result.picturethis||""};
    state.addPhase="confirm";
  }catch(e){
    state.addError="Erro: "+e.message;state.addPhase="manual";
    state.addForm=state.addForm||resetAddForm();
  }
  refreshModal();
}

function saveNewPlant(){
  const f=state.addForm||resetAddForm();
  if(!f.name.trim()){state.addError="O nome é obrigatório.";refreshModal();return;}
  const slug=slugify(f.name)+"-"+Date.now().toString(36);
  const plant={id:slug,num:"X",name:f.name.trim(),scientific:f.scientific.trim(),store:f.store.trim()||"Desconhecida",date:f.date,price:parseFloat(f.price)||0,light:f.light,watering:f.watering.trim(),soil:f.soil.trim(),humidity:f.humidity.trim(),tempRange:f.tempRange.trim(),notes:f.notes.trim(),url:f.picturethis.trim(),photo:state.addPreview,custom:true};
  state.customPlants=[...state.customPlants,plant];
  saveCustomPlants(state.customPlants);
  if(state.addPreview)state.covers[slug]=state.addPreview;
  state.deadMap[slug]=false;state.giftedMap[slug]=false;
  state.showAdd=false;
  document.getElementById("add-modal")?.remove();
  document.querySelectorAll("#add-cam,#add-gal").forEach(e=>e.remove());
  render();
}

// ─── Start ────────────────────────────────────────────────────────────────────
render();
</script>
