// Carregar React com fallbacks
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
}
async function loadReact() {
  const sources = [
    ['https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js',
     'https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js'],
    ['https://unpkg.com/react@18.2.0/umd/react.production.min.js',
     'https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js'],
    ['https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js',
     'https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js'],
  ];
  for (const [r, rd] of sources) {
    try {
      await loadScript(r);
      await loadScript(rd);
      console.log('React carregado de:', r);
      return true;
    } catch(e) {
      console.warn('Falhou:', r, e);
    }
  }
  document.getElementById('root').innerHTML = '<div style="padding:40px;font-family:sans-serif;text-align:center"><h2>Erro ao carregar</h2><p>Verifica a ligação à internet e recarrega a página.</p></div>';
  return false;
}

// Recharts shim — implementação simples compatível com a API usada na app
function ResponsiveContainer({width, height, children}) {
  const ref = React.useRef(null);
  const [w, setW] = React.useState(300);
  React.useEffect(() => {
    if (!ref.current) return;
    const ro = new ResizeObserver(([e]) => setW(e.contentRect.width));
    ro.observe(ref.current);
    return () => ro.disconnect();
  }, []);
  return React.createElement('div', {ref, style:{width:'100%',height}},
    React.cloneElement(React.Children.only(children), {width:w, height})
  );
}

function LineChart({data=[], children, width=300, height=200, margin={top:5,right:5,bottom:5,left:5}}) {
  const childArr = React.Children.toArray(children);
  const lines = childArr.filter(c => c.type === Line);
  const xAxis = childArr.find(c => c.type === XAxis);
  const tooltipEl = childArr.find(c => c.type === Tooltip);

  const mt=margin.top||5, mr=margin.right||5, mb=margin.bottom||30, ml=margin.left||36;
  const W = width-ml-mr, H = height-mt-mb;

  // Calcular domínios
  const allVals = lines.flatMap(l => data.map(d => d[l.props.dataKey]).filter(v => v!=null));
  const minV = allVals.length ? Math.min(...allVals) : 0;
  const maxV = allVals.length ? Math.max(...allVals) : 100;
  const padV = (maxV - minV) * 0.1 || 5;
  const lo = minV - padV, hi = maxV + padV;

  const px = (i) => ml + (i / Math.max(data.length-1,1)) * W;
  const py = (v, lo2, hi2) => mt + H - ((v-lo2)/(hi2-lo2||1)) * H;

  // Separar linhas por yAxisId para eixos distintos
  const yAxes = {};
  lines.forEach(l => {
    const id = l.props.yAxisId || 'left';
    if (!yAxes[id]) yAxes[id] = {min:Infinity,max:-Infinity,lines:[]};
    data.forEach(d => { const v=d[l.props.dataKey]; if(v!=null){yAxes[id].min=Math.min(yAxes[id].min,v);yAxes[id].max=Math.max(yAxes[id].max,v);} });
    yAxes[id].lines.push(l);
  });
  Object.values(yAxes).forEach(ax => {
    const p=(ax.max-ax.min)*0.15||5; ax.lo=ax.min-p; ax.hi=ax.max+p;
  });

  const [tooltip, setTooltip] = React.useState(null);

  const svgLines = lines.map((l,li) => {
    const key = l.props.dataKey;
    const color = l.props.stroke || '#4b5e42';
    const sw = l.props.strokeWidth || 2;
    const axId = l.props.yAxisId || 'left';
    const ax = yAxes[axId] || {lo,hi};
    const pts = data.map((d,i) => d[key]!=null ? `${px(i).toFixed(1)},${py(d[key],ax.lo,ax.hi).toFixed(1)}` : null);
    // Split at nulls
    let path = ''; let started = false;
    pts.forEach((p,i) => {
      if (!p) { started=false; return; }
      path += started ? ` L${p}` : ` M${p}`;
      started = true;
    });
    const dots = data.map((d,i) => d[key]!=null ?
      React.createElement('circle',{key:i,cx:px(i),cy:py(d[key],ax.lo,ax.hi),r:3,fill:color,stroke:'#fff',strokeWidth:1}) : null
    );
    return React.createElement('g',{key:li},
      React.createElement('path',{d:path,fill:'none',stroke:color,strokeWidth:sw,strokeLinecap:'round',strokeLinejoin:'round'}),
      ...dots
    );
  });

  // X labels — mostrar 3 labels
  const xLabels = data.length > 0 ? [0, Math.floor(data.length/2), data.length-1].filter((v,i,a)=>a.indexOf(v)===i).map(i =>
    React.createElement('text',{key:i,x:px(i),y:height-mb+14,textAnchor:'middle',fontSize:9,fill:'#6b7a5f',fontFamily:'monospace'},
      (data[i]?.label||'').slice(-5))
  ) : [];

  return React.createElement('svg',{
    width,height,
    onMouseMove: e => {
      const rect = e.currentTarget.getBoundingClientRect();
      const mx = e.clientX - rect.left - ml;
      const idx = Math.round((mx/W)*(data.length-1));
      if (idx>=0 && idx<data.length) setTooltip({idx,x:px(idx),d:data[idx]});
    },
    onMouseLeave: () => setTooltip(null)
  },
    // Grid lines
    [0,0.25,0.5,0.75,1].map((t,i) =>
      React.createElement('line',{key:i,x1:ml,x2:ml+W,y1:mt+H*t,y2:mt+H*t,stroke:'#e4e2cf',strokeWidth:0.5})
    ),
    ...svgLines,
    ...xLabels,
    // Tooltip
    tooltip && React.createElement('g',{key:'tip'},
      React.createElement('line',{x1:tooltip.x,x2:tooltip.x,y1:mt,y2:mt+H,stroke:'#c7c4a8',strokeWidth:1,strokeDasharray:'3 2'}),
      React.createElement('rect',{x:tooltip.x+6,y:mt,width:90,height:lines.length*16+10,rx:4,fill:'#F8F4E7',stroke:'#d8d4bd',strokeWidth:1}),
      lines.map((l,li) => {
        const v=tooltip.d[l.props.dataKey];
        return v!=null ? React.createElement('text',{key:li,x:tooltip.x+12,y:mt+14+li*16,fontSize:10,fill:l.props.stroke,fontFamily:'monospace'},
          `${l.props.name||l.props.dataKey}: ${v}`) : null;
      })
    )
  );
}

function compressImage(file,maxDim=800,quality=0.65){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=(e)=>{
      const img=new Image();
      img.onload=()=>{
        let{width,height}=img;
        if(width>height&&width>maxDim){height=Math.round(height*maxDim/width);width=maxDim;}
        else if(height>maxDim){width=Math.round(width*maxDim/height);height=maxDim;}
        const canvas=document.createElement("canvas");canvas.width=width;canvas.height=height;
        canvas.getContext("2d").drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL("image/jpeg",quality));
      };
      img.onerror=reject;img.src=e.target.result;
    };
    reader.onerror=reject;reader.readAsDataURL(file);
  });
}

function getGeminiKey() {
  try { return localStorage.getItem("gemini-api-key") || ""; } catch { return ""; }
}

async function identifyPlantFromImage(base64) {
  const key = getGeminiKey();
  if (!key) throw new Error("Sem API key. Configura a Gemini API key nas definições.");

  const body = {
    contents: [{
      parts: [
        { inline_data: { mime_type: "image/jpeg", data: base64 } },
        { text: "Identifica a especie desta planta. Responde so com JSON valido sem markdown: {name,scientific,light,watering,soil,humidity,tempRange,picturethis,notes}" }
      ]
    }],
    generationConfig: { maxOutputTokens: 300, temperature: 0.1 }
  };

  const resp = await fetch(
    "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + key,
    { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }
  );
  const data = await resp.json();
  if (data.error) throw new Error("Gemini: " + (data.error.message || JSON.stringify(data.error)));
  const text = (data.candidates?.[0]?.content?.parts?.[0]?.text) || "";
  console.log("Gemini identify:", text);
  const match = text.match(/\{[\s\S]*\}/);
  if (!match) throw new Error("Sem JSON na resposta: " + text.slice(0, 100));
  return JSON.parse(match[0]);
}

    if (!file) return;
    setError(null); setApiLog(""); setPhase("scanning");

      // Comprimir agressivamente para minimizar tokens (512px, qualidade 0.5)
      const dataUrl = await compressImage(file, 512, 0.5);
      setPreview(dataUrl);

        model: "claude-sonnet-4-6",
        max_tokens: 300,

          content: [

async function extractReadingFromImage(base64) {
  const key = getGeminiKey();
  if (!key) throw new Error("Sem API key. Configura a Gemini API key nas definições.");

  const body = {
    contents: [{
      parts: [
        { inline_data: { mime_type: "image/jpeg", data: base64 } },
        { text: "Le os valores de temperatura e humidade neste ecra de medicao. Responde so com JSON: {temp: numero, hum: numero}. Se nao conseguires ler usa null." }
      ]
    }],
    generationConfig: { maxOutputTokens: 80, temperature: 0 }
  };

  const resp = await fetch(
    "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + key,
    { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }
  );
  const data = await resp.json();
  if (data.error) throw new Error("Gemini: " + (data.error.message || JSON.stringify(data.error)));
  const text = (data.candidates?.[0]?.content?.parts?.[0]?.text) || "";
  console.log("Gemini extract:", text);
  const match = text.match(/\{[^}]+\}/);
  if (!match) throw new Error("Sem JSON: " + text.slice(0, 80));
  const result = JSON.parse(match[0]);
  if (result.temp !== null && (result.temp < -10 || result.temp > 60)) result.temp = null;
  if (result.hum  !== null && (result.hum  <   0 || result.hum  > 100)) result.hum  = null;
  return result;
}


function EstufaPage() {
  const [readings, setReadings] = useState(()=>loadReadings());
  const [phase, setPhase] = useState("idle");
  const [preview, setPreview] = useState(null);
  const [extracted, setExtracted] = useState({temp:"",hum:""});
  const [error, setError] = useState(null);
  const [chartRange, setChartRange] = useState("7d");
  const camRef = useRef(null);
  const galRef = useRef(null);

  const handleFile = async (file) => {
    if (!file) return;
    setError(null);
    setPhase("scanning");
    try {
      const dataUrl = await compressImage(file, 600, 0.6);
      const base64 = dataUrl.split(",")[1];
      setPreview(dataUrl);
      const result = await extractReadingFromImage(base64);
      setExtracted({temp: result.temp ?? "", hum: result.hum ?? ""});
      setPhase("confirm");
    } catch(e) {
      console.error("Erro na extracção:", e);
      const msg = e?.message?.includes("API HTTP 429") ? "Limite de pedidos atingido — tenta daqui a pouco."
                : e?.message?.includes("API HTTP 4") ? "Erro de autenticação com a API."
                : "Não foi possível ler os valores automaticamente. Podes introduzi-los manualmente.";
      setError(msg);
      setPhase("manual");
    }
  };

  const saveReading = () => {
    const t = parseFloat(String(extracted.temp).replace(",","."));
    const h = parseFloat(String(extracted.hum).replace(",","."));
    if (isNaN(t) && isNaN(h)) { setError("Introduz pelo menos temperatura ou humidade."); return; }
    const entry = {
      id: Date.now().toString(36),
      ts: new Date().toISOString(),
      temp: isNaN(t) ? null : t,
      hum: isNaN(h) ? null : h,
      photo: preview,
    };
    const next = [entry, ...readings];
    setReadings(next);
    saveReadings(next);
    setPhase("idle");
    setPreview(null);
    setExtracted({temp:"",hum:""});

  const deleteReading = (id) => {
    const next = readings.filter(r=>r.id!==id);
    setReadings(next);

  const cancel = () => { setPhase("idle"); setPreview(null); setExtracted({temp:"",hum:""}); setError(null); };

  const now = Date.now();

    .filter(r => now - new Date(r.ts).getTime() <= rangMs)

  return(
    <div style={{minHeight:"100vh",background:"#EDE6D6",backgroundImage:"radial-gradient(circle at 1px 1px,rgba(75,94,66,0.07) 1px,transparent 0)",backgroundSize:"22px 22px",fontFamily:"'Inter',sans-serif",padding:"max(20px,env(safe-area-inset-top)) 16px calc(68px + env(safe-area-inset-bottom))"}}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}html,body{overscroll-behavior-y:contain;}`}</style>
      <div style={{maxWidth:"1040px",margin:"0 auto"}}>

        {activePlant?(
          <PlantDetail plant={activePlant} onBack={()=>{setSelected(null);requestAnimationFrame(()=>window.scrollTo(0,scrollPos.current));}} onPhotoSaved={(id,dataUrl)=>setCovers(prev=>({...prev,[id]:dataUrl}))} onDeadToggle={(id,val)=>setDeadMap(prev=>({...prev,[id]:val}))} onGiftedToggle={(id,val)=>setGiftedMap(prev=>({...prev,[id]:val}))}/>

        ):page==="settings"?(<SettingsPage/>):page==="stock"?(<StockPage/>

        ):page==="estufa"?(<EstufaPage/>

        ):page==="stats"?(
          <>
            <header style={{marginBottom:"26px"}}>
              <div style={{display:"inline-flex",alignItems:"center",gap:"6px",fontFamily:"'IBM Plex Mono',monospace",fontSize:"11px",letterSpacing:"0.08em",textTransform:"uppercase",color:"#6b7a5f",marginBottom:"8px"}}><Leaf size={13} strokeWidth={2}/> Estatísticas</div>
              <h1 style={{fontFamily:"'Fraunces',serif",fontWeight:700,fontSize:"32px",color:"#1f2e1a",margin:"0 0 6px"}}>A Minha Coleção</h1>
            </header>
            <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:"8px",marginBottom:"28px"}}>
              {[{v:PLANTS.length,l:"Total"},{v:stats.alive.length,l:"Vivas"},{v:stats.dead.length,l:"Mortas",color:"#c0621e",bg:"#fdf6ee",border:"#e07b39"},{v:stats.gifted.length,l:"Oferecidas",color:"#3a7a52",bg:"#f0f4ee",border:"#5c9e6e"},{v:`€${TOTAL.toFixed(0)}`,l:"Investimento"},{v:`€${(TOTAL/PLANTS.length).toFixed(2)}`,l:"Custo médio"},{v:stats.withPhotos.length,l:"Com fotos"}].map(k=>(<div key={k.l} style={{background:k.bg||"#F8F4E7",border:`1px solid ${k.border||"#d8d4bd"}`,borderRadius:"8px",padding:"12px 6px",textAlign:"center"}}><span style={{display:"block",fontFamily:"'Fraunces',serif",fontSize:"20px",fontWeight:600,color:k.color||"#1f2e1a",lineHeight:1}}>{k.v}</span><span style={{display:"block",fontFamily:"'IBM Plex Mono',monospace",fontSize:"9px",textTransform:"uppercase",letterSpacing:"0.05em",color:"#8a8568",marginTop:"5px"}}>{k.l}</span></div>))}
            </div>
            {[
              {title:"Famílias mais representadas",content:(<div style={{display:"flex",flexDirection:"column",gap:"8px"}}>{stats.topFamilies.map(([fam,count])=>(<div key={fam} style={{display:"flex",alignItems:"center",gap:"10px"}}><span style={{fontSize:"13px",color:"#2c3826",width:"100px",flexShrink:0,fontWeight:500}}>{fam}</span><div style={{flex:1,height:"10px",background:"#e4e2cf",borderRadius:"5px",overflow:"hidden"}}><div style={{height:"100%",background:"#4b5e42",borderRadius:"5px",width:`${(count/BAR_MAX)*100}%`}}/></div><span style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:"11px",color:"#5c6b52",width:"18px",textAlign:"right"}}>{count}</span></div>))}</div>)},
              {title:"Necessidade de luz",pill:Object.entries(stats.byLight).map(([l,c])=>({l,c}))},
              {title:"Substrato recomendado",pill:Object.entries(stats.bySoil).sort((a,b)=>b[1]-a[1]).map(([l,c])=>({l,c}))},
              {title:"Plantas por loja",pillExtra:Object.entries(stats.byStore).sort((a,b)=>b[1]-a[1]).map(([l,c])=>({l,c,extra:`€${stats.spendByStore[l].toFixed(2)}`}))},
              {title:"Aquisições por mês",pill:Object.entries(stats.byMonth).sort().map(([m,c])=>({l:new Date(m+"-01T00:00:00").toLocaleDateString("pt-PT",{month:"long",year:"numeric"}),c,cap:true}))},
              {title:"Humidade recomendada",pill:Object.entries(stats.byHumidity).sort((a,b)=>a[0].localeCompare(b[0])).map(([l,c])=>({l,c}))},
              {title:"Temperatura recomendada",pill:Object.entries(stats.byTemp).sort((a,b)=>a[0].localeCompare(b[0])).map(([l,c])=>({l,c}))},
            ].map(s=>(<div key={s.title} style={{marginBottom:"26px"}}><h2 style={{fontFamily:"'Fraunces',serif",fontSize:"17px",color:"#223420",margin:"0 0 12px"}}>{s.title}</h2>{s.content||<div style={{background:"#F8F4E7",border:"1px solid #d8d4bd",borderRadius:"8px",overflow:"hidden"}}>{(s.pill||s.pillExtra||[]).map((r,i,arr)=>(<div key={r.l} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"11px 14px",borderBottom:i<arr.length-1?"1px solid #ede9d5":"none",fontSize:"13.5px",color:"#2c3826",gap:"12px"}}><span style={r.cap?{textTransform:"capitalize"}:{}}>{r.l}</span><div style={{display:"flex",gap:"8px",alignItems:"center"}}>{r.extra&&<span style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:"11px",color:"#8a8568"}}>{r.extra}</span>}<span style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:"11px",background:"#2F4A34",color:"#F4EFDE",borderRadius:"12px",padding:"2px 8px",flexShrink:0}}>{r.c}</span></div></div>))}</div>}</div>))}
            <div style={{height:"16px"}}/>
          </>

        ):(
          <>
            <header style={{marginBottom:"20px"}}>
              <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:"12px"}}>
                <div>
                  <div style={{display:"inline-flex",alignItems:"center",gap:"6px",fontFamily:"'IBM Plex Mono',monospace",fontSize:"11px",letterSpacing:"0.08em",textTransform:"uppercase",color:"#6b7a5f",marginBottom:"8px"}}><Leaf size={13} strokeWidth={2}/> Diário &amp; Tracking</div>
                  <h1 style={{fontFamily:"'Fraunces',serif",fontWeight:700,fontSize:"32px",color:"#1f2e1a",margin:"0 0 6px"}}>As Minhas Plantas</h1>
                  <p style={{fontSize:"13.5px",color:"#6b7a5f",margin:0,fontFamily:"'IBM Plex Mono',monospace"}}>Coleção de {allPlants.length} espécimes · Total investido €{(TOTAL+customPlants.reduce((a,p)=>a+p.price,0)).toFixed(2)}</p>
                </div>
                <button onClick={()=>setShowAdd(true)} style={{flexShrink:0,display:"flex",alignItems:"center",gap:"6px",background:"#2F4A34",color:"#F4EFDE",border:"none",borderRadius:"8px",padding:"10px 14px",fontSize:"13px",fontWeight:600,cursor:"pointer",minHeight:"44px",fontFamily:"inherit",marginTop:"6px"}}>
                  <Plus size={16} strokeWidth={2}/> Adicionar
                </button>
              </div>
            </header>
            <div style={{display:"flex",flexDirection:"column",gap:"12px",marginBottom:"22px"}}>
              <div style={{display:"flex",alignItems:"center",gap:"8px",background:"#F8F4E7",border:"1px solid #d8d4bd",borderRadius:"8px",padding:"11px 12px",maxWidth:"340px",color:"#6b7a5f"}}><Search size={14} strokeWidth={2}/><input type="text" placeholder="Procurar por nome ou loja..." value={query} onChange={e=>setQuery(e.target.value)} style={{border:"none",background:"none",outline:"none",fontSize:"16px",width:"100%",fontFamily:"inherit",color:"#223420"}}/></div>
              <div style={{display:"flex",gap:"7px",flexWrap:"wrap"}}>
                {["Todas","Muita luz","Luz indireta","Pouca luz","Oferecidas"].map(g=>(<button key={g} onClick={()=>setFilter(g)} style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:"11.5px",letterSpacing:"0.02em",background:filter===g?"#2F4A34":"transparent",border:`1px solid ${filter===g?"#2F4A34":"#c7c4a8"}`,color:filter===g?"#F4EFDE":"#5c6b52",borderRadius:"20px",padding:"8px 14px",cursor:"pointer",minHeight:"36px"}}>{g}</button>))}
              </div>
            </div>
            {filtered.length===0?<p style={{color:"#8a8568",fontSize:"13px"}}>Nenhuma planta encontrada.</p>:(
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px"}}>
                {filtered.map(p=><PlantCard key={p.id} plant={p} cover={covers[p.id]} dead={deadMap[p.id]} gifted={giftedMap[p.id]} onOpen={()=>{scrollPos.current=window.scrollY;window.scrollTo(0,0);setSelected(p.id);}}/>)}
              </div>
            )}
          </>
        )}
      </div>

      {showAdd&&<AddPlantModal onClose={()=>setShowAdd(false)} onSave={(plant)=>{const next=[...customPlants,plant];setCustomPlants(next);saveCustomPlants(next);setShowAdd(false);}}/>}
      {!activePlant&&(
        <nav style={{position:"fixed",left:0,right:0,bottom:0,zIndex:30,background:"#F8F4E7",borderTop:"1px solid #d8d4bd",display:"flex",padding:"6px 0 calc(6px + env(safe-area-inset-bottom))"}}>
          {NAV.map(btn=>(<button key={btn.id} onClick={()=>setPage(btn.id)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:"2px",background:"none",border:"none",cursor:"pointer",color:page===btn.id?"#2F4A34":"#8a8568",fontFamily:"'IBM Plex Mono',monospace",fontSize:"9px",letterSpacing:"0.04em",textTransform:"uppercase",padding:"5px 0"}}>{btn.icon}<span>{btn.label}</span></button>))}
        </nav>
      )}
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(createElement(App));
}
</script>
</body>
</html>
